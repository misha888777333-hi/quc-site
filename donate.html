<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QUC — Поддержать</title>
<link rel="icon" type="image/jpeg" href="quc-coin-cosmic.jpg" />
<link rel="stylesheet" href="style.css" />
<style>.card p a, .card li a { color:#b7c3ff; text-decoration:underline; } .card p a:hover { color:#fff; }</style>
</head>
<body>
<div class="wrap">

  <nav>
    <a href="index.html" data-i18n="nav.home">Главная</a>
    <a href="stake.html" data-i18n="nav.stake">Стейкинг</a>
    <a href="mint.html" data-i18n="nav.mint">Минт NFT</a>
    <a href="games.html" data-i18n="nav.games">Игры</a>
    <a href="donate.html" class="active" aria-current="page" data-i18n="nav.donate">Поддержать</a>
  </nav>

  <h1 data-i18n="donate.title">Открытая копилка QUC</h1>
  <p data-i18n="donate.intro"></p>

  <!-- Способ 1: кошелёк, который есть в браузере (любой: MetaMask, Rabby, Trust, Coinbase, OKX…) -->
  <div class="card">
    <h2 data-i18n="donate.quick.title"></h2>
    <p data-i18n="donate.quick.text"></p>
    <p><span data-i18n="donate.amount.label"></span>:</p>
    <p><input id="custom" type="text" inputmode="decimal" autocomplete="off" data-i18n-placeholder="donate.amount.custom" style="max-width:220px;" /></p>
    <div id="picker" style="display:none; margin:8px 0;">
      <p><b data-i18n="donate.pick.title"></b></p>
      <div id="pickerList" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>
    <p><button id="send" type="button" data-i18n="donate.send"></button></p>
    <p id="wcRow" style="display:none;"><button id="wcBtn" type="button" data-i18n="donate.wc.button"></button></p>
    <p id="status" style="font-size:14px; word-break:break-all;"></p>
    <p style="font-size:14px;"><span data-i18n="donate.apps"></span><br>
      <a id="mmLink" data-i18n="donate.open.mm" href="#"></a> ·
      <a id="trustLink" data-i18n="donate.open.trust" href="#"></a> ·
      <a id="cbLink" data-i18n="donate.open.cb" href="#"></a> ·
      <a id="okxLink" data-i18n="donate.open.okx" href="#"></a></p>
  </div>

  <!-- Способ 2: любой другой кошелёк или биржа — вручную, по QR или адресу -->
  <div class="card">
    <h2 data-i18n="donate.other.title"></h2>
    <ol>
      <li data-i18n="donate.other.step1"></li>
      <li data-i18n="donate.other.step2"></li>
      <li data-i18n="donate.other.step3"></li>
    </ol>
    <p><img id="qr" src="donate-qr.png" width="200" height="200" alt="" style="background:#fff; padding:6px; border-radius:8px;" /></p>
    <p><span data-i18n="donate.addr.label"></span><br>
      <code id="addr" style="word-break:break-all;">0x63eE6D1B1E7C732295BaB1eAE28b39Dc66eB4a58</code></p>
    <p><button id="copy" type="button" data-i18n="donate.copy"></button></p>
    <p style="font-size:13px; opacity:.85;" data-i18n="donate.note"></p>
  </div>

  <div class="card">
    <h2 data-i18n="donate.live.title"></h2>
    <p><span data-i18n="donate.bal"></span>: <b id="bal">—</b> BNB</p>
    <p><span data-i18n="donate.pool"></span>: <b id="poolBnb">—</b> BNB <span data-i18n="donate.and"></span> <b id="poolQuc">—</b> QUC</p>
    <p style="font-size:13px; opacity:.85;" data-i18n="donate.src"></p>
  </div>

  <div class="card">
    <h2 data-i18n="donate.rules.title"></h2>
    <ul>
      <li data-i18n="donate.rule1"></li>
      <li data-i18n="donate.rule2"></li>
      <li data-i18n="donate.rule3"></li>
      <li data-i18n="donate.rule4"></li>
    </ul>
    <p style="font-size:13px; opacity:.85;" data-i18n="donate.risk"></p>
  </div>

</div>

<script src="i18n.js?v=20261011e"></script>
<script>
const DONATE = "0x63eE6D1B1E7C732295BaB1eAE28b39Dc66eB4a58";           // публичный адрес копилки (11.10.2026)
const PAIR = "0x08239328707e9965c5b1d4e41b9ddc2f23aaf15c";             // PancakeSwap V2 QUC/WBNB
const RPC = "https://bsc-dataseed.binance.org";
let state = {bal: null, quc: null, bnb: null, fail: false};
let statusKey = null, statusExtra = "";

async function rpc(method, params) {
  const r = await fetch(RPC, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({jsonrpc: "2.0", id: 1, method, params})});
  return (await r.json()).result;
}
const hexToNum = (h, d = 18) => Number(BigInt(h)) / 10 ** d;
const fmt = (x, n = 4) => x.toLocaleString(document.documentElement.lang || "ru", {maximumFractionDigits: n});

function render() {
  const set = (id, v) => { document.getElementById(id).textContent = v; };
  if (state.fail) set("bal", t("donate.fail"));
  else if (state.bal === null) set("bal", t("donate.noaddr"));
  else set("bal", fmt(state.bal, 6));
  if (state.quc !== null) { set("poolQuc", fmt(state.quc, 0)); set("poolBnb", fmt(state.bnb, 6)); }
}
// вызывается из i18n.js при смене языка
function onLanguageChanged() {
  document.title = "QUC — " + t("nav.donate");
  document.getElementById("qr").alt = t("donate.qr.alt");
  render(); if (statusKey) setStatus(statusKey, statusExtra);
}
document.title = "QUC — " + t("nav.donate");
document.getElementById("qr").alt = t("donate.qr.alt");

document.getElementById("copy").onclick = () => {
  navigator.clipboard.writeText(DONATE).then(() => {
    const b = document.getElementById("copy");
    b.textContent = t("donate.copied");
    setTimeout(() => { b.textContent = t("donate.copy"); }, 2000);
  });
};

// ---- пожертвование в один клик: ЛЮБОЙ кошелёк, встроенный в браузер (EIP-6963 + запасной window.ethereum) ----
// Деньги уходят из кошелька того, кто нажал кнопку, на адрес копилки; подтверждает перевод сам человек в своём кошельке.
const BSC = {chainId: "0x38", chainName: "BNB Smart Chain", nativeCurrency: {name: "BNB", symbol: "BNB", decimals: 18},
  rpcUrls: ["https://bsc-dataseed.binance.org"], blockExplorerUrls: ["https://bscscan.com"]};
const setStatus = (key, extra = "") => {
  statusKey = key; statusExtra = extra;
  const el = document.getElementById("status");
  el.textContent = key ? t(key) + (extra ? " " : "") : "";
  if (extra) {
    const a = document.createElement("a");
    a.href = "https://bscscan.com/tx/" + extra; a.target = "_blank"; a.rel = "noopener"; a.textContent = extra.slice(0, 10) + "…" + extra.slice(-6);
    el.appendChild(a);
  }
};
const parseWei = s => {  // "0.01" -> BigInt wei, без потери точности; любая сумма больше нуля
  s = s.trim().replace(",", ".");
  if (!/^\d+(\.\d{1,18})?$/.test(s)) return null;
  const [i, f = ""] = s.split(".");
  const wei = BigInt(i) * 10n ** 18n + BigInt((f + "0".repeat(18)).slice(0, 18));
  return wei > 0n ? wei : null;
};

// все кошельки-расширения, объявившиеся на странице
const wallets = new Map();
window.addEventListener("eip6963:announceProvider", e => { if (e.detail && e.detail.info) wallets.set(e.detail.info.uuid, e.detail); });
window.dispatchEvent(new Event("eip6963:requestProvider"));

function chooseWallet() {  // -> provider | null (если кошелька в браузере нет)
  window.dispatchEvent(new Event("eip6963:requestProvider"));
  const list = [...wallets.values()];
  if (list.length === 0) return Promise.resolve(window.ethereum || null);
  if (list.length === 1) return Promise.resolve(list[0].provider);
  return new Promise(resolve => {  // несколько кошельков: пусть человек сам выберет
    const box = document.getElementById("picker"), row = document.getElementById("pickerList");
    row.textContent = "";
    list.forEach(w => {
      const b = document.createElement("button"); b.type = "button";
      b.style.cssText = "display:flex; align-items:center; gap:8px;";
      if (w.info.icon) { const im = document.createElement("img"); im.src = w.info.icon; im.width = 22; im.height = 22; im.alt = ""; b.appendChild(im); }
      b.appendChild(document.createTextNode(w.info.name));
      b.onclick = () => { box.style.display = "none"; resolve(w.provider); };
      row.appendChild(b);
    });
    box.style.display = "block";
  });
}

// ссылки «открыть эту страницу в приложении кошелька» (для телефона и тех, у кого нет расширения)
const here = location.href.split("?")[0].split("#")[0];
const hereNoProto = here.replace(/^https?:\/\//, "");
document.getElementById("mmLink").href = "https://metamask.app.link/dapp/" + hereNoProto;
document.getElementById("trustLink").href = "https://link.trustwallet.com/open_url?coin_id=20000714&url=" + encodeURIComponent(here);
document.getElementById("cbLink").href = "https://go.cb-w.com/dapp?cb_url=" + encodeURIComponent(here);
document.getElementById("okxLink").href = "okx://wallet/dapp/url?dappUrl=" + encodeURIComponent(here);

// общая отправка: переключить сеть на BSC (если надо) и попросить кошелёк подтвердить перевод на адрес копилки
async function sendDonation(eth, wei) {
  const accs = (eth.accounts && eth.accounts.length) ? eth.accounts : await eth.request({method: "eth_requestAccounts"});
  const from = accs[0];
  const cid = await eth.request({method: "eth_chainId"});
  if (String(cid).toLowerCase() !== BSC.chainId && Number(cid) !== 56) {
    setStatus("donate.st.network");
    try { await eth.request({method: "wallet_switchEthereumChain", params: [{chainId: BSC.chainId}]}); }
    catch (e) {
      if (e && e.code === 4902) await eth.request({method: "wallet_addEthereumChain", params: [BSC]});
      else throw e;
    }
  }
  setStatus("donate.st.confirm");
  const hash = await eth.request({method: "eth_sendTransaction",
    params: [{from, to: DONATE, value: "0x" + wei.toString(16)}]});
  setStatus("donate.st.sent", hash);
}

document.getElementById("send").onclick = async () => {
  const wei = parseWei(document.getElementById("custom").value);
  if (!wei) { setStatus("donate.st.badamount"); return; }
  try {
    setStatus("donate.st.connecting");
    const eth = await chooseWallet();
    if (!eth) { setStatus("donate.st.nowallet"); return; }
    await sendDonation(eth, wei);
  } catch (e) { setStatus("donate.st.rejected"); }
};

// ---- WalletConnect: любой кошелёк по QR-коду или через приложение на телефоне ----
// Project ID — публичный идентификатор (не секрет), бесплатно создаётся на cloud.reown.com. Пока пуст — кнопка скрыта.
const WC_PROJECT_ID = "6469802639fa1244e9473fa268d2df74";
const WC_SRC = "vendor/walletconnect-ethereum-provider-2.26.0.js";   // наш собственный файл, не чужой CDN
if (WC_PROJECT_ID) document.getElementById("wcRow").style.display = "block";
function loadScript(src) {
  return new Promise((ok, fail) => {
    if (window.WCEthereumProvider) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error("load")); document.head.appendChild(s);
  });
}
document.getElementById("wcBtn").onclick = async () => {
  const wei = parseWei(document.getElementById("custom").value);
  if (!wei) { setStatus("donate.st.badamount"); return; }
  let wc = null;
  try {
    setStatus("donate.wc.loading");
    await loadScript(WC_SRC);
    wc = await window.WCEthereumProvider.init({
      projectId: WC_PROJECT_ID, chains: [56], showQrModal: true,
      rpcMap: {56: RPC},
      metadata: {name: "Quantum Universe Coin", description: "QUC open donation fund", url: location.origin, icons: [location.origin + "/quc-site/quc-coin-cosmic.jpg"]},
    });
    setStatus("donate.st.connecting");
    await wc.connect();            // открывает окно: QR-код / список кошельков
    await sendDonation(wc, wei);
  } catch (e) { setStatus("donate.st.rejected"); }
  finally { try { if (wc && wc.session) await wc.disconnect(); } catch (_) {} }
};

(async () => {
  try {
    if (DONATE.startsWith("0x")) state.bal = hexToNum(await rpc("eth_getBalance", [DONATE, "latest"]));
    const res = await rpc("eth_call", [{to: PAIR, data: "0x0902f1ac"}, "latest"]);
    state.quc = hexToNum("0x" + res.slice(2, 66));     // token0 = QUC
    state.bnb = hexToNum("0x" + res.slice(66, 130));   // token1 = WBNB
  } catch (e) { state.fail = true; }
  render();
})();
</script>
</body>
</html>
